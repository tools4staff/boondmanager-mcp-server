apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boond-mcp-ingress
  namespace: tools4staff
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - boond.infine.com
      secretName: boond-mcp-tls
  rules:
    - host: boond.infine.com
      http:
        paths:
          # Tout va au serveur MCP : /mcp (endpoint), /.well-known/oauth-protected-resource*
          # (découverte OAuth, RFC 9728) et /healthz.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: boond-mcp-service
                port:
                  number: 3000
