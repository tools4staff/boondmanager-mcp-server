name: Build and Deploy (In Fine)

# Déploiement du fork In Fine sur le cluster Kubernetes partagé avec
# tools4staff/contract (namespace tools4staff, ingress Traefik, cert-manager).
# Push sur infine_main = tests, image ghcr.io/tools4staff/boondmanager-mcp-server:sha-<commit>,
# puis `kubectl apply -f k8s/` sur https://boond.infine.com. Voir k8s/README.md.

on:
  push:
    branches: [infine_main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install, lint, typecheck, test, build
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run build
          npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.tags.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMAGE_SHA="${IMAGE}:sha-${GITHUB_SHA::7}"
          echo "image=${IMAGE_SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${IMAGE_SHA}"
            echo "${IMAGE}:infine"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: prod
    env:
      IMAGE_SHA: ${{ needs.build-and-push.outputs.image }}
      # Le secret Kubernetes du relais SharePoint n'est géré par la CI que si
      # les secrets GitHub existent ; sinon celui appliqué à la main
      # (k8s/secrets.yaml) fait foi.
      MANAGE_K8S_SECRET: ${{ secrets.BOOND_MCP_SHAREPOINT_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Kubeconfig
        uses: azure/k8s-set-context@8698eba2499e9012f0d5085f8798077cce4bc526 # v5.0.1
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Check cluster access and prerequisites
        run: |
          kubectl version --client
          kubectl get namespace tools4staff
          kubectl get secret ghcr-credentials-boond-mcp -n tools4staff -o name \
            || { echo "::error::Secret ghcr-credentials-boond-mcp absent du namespace tools4staff (voir k8s/README.md)"; exit 1; }
          if [ "$MANAGE_K8S_SECRET" != "true" ] \
            && ! kubectl get secret boond-mcp-secrets -n tools4staff -o name; then
            echo "::warning::Ni secrets GitHub BOOND_MCP_SHAREPOINT_* ni secret boond-mcp-secrets : le relais d'upload sera désactivé (voir k8s/README.md)"
          fi

      - name: Set image tag in manifests
        run: |
          sed -i "s|image: boondmanager-mcp-server:latest|image: ${IMAGE_SHA}|" k8s/deployment.yaml
          grep -q "image: ${IMAGE_SHA}" k8s/deployment.yaml

      - name: Create Kubernetes secret
        if: env.MANAGE_K8S_SECRET == 'true'
        env:
          SP_CLIENT_ID: ${{ secrets.BOOND_MCP_SHAREPOINT_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.BOOND_MCP_SHAREPOINT_CLIENT_SECRET }}
          SP_SITE: ${{ secrets.BOOND_MCP_SHAREPOINT_SITE }}
        run: |
          kubectl create secret generic boond-mcp-secrets \
            --namespace=tools4staff \
            --from-literal=BOOND_MCP_SHAREPOINT_CLIENT_ID="$SP_CLIENT_ID" \
            --from-literal=BOOND_MCP_SHAREPOINT_CLIENT_SECRET="$SP_CLIENT_SECRET" \
            --from-literal=BOOND_MCP_SHAREPOINT_SITE="$SP_SITE" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml -f k8s/configmap.yaml -f k8s/deployment.yaml -f k8s/ingress.yaml
          # Un changement de ConfigMap ou de Secret ne redémarre pas le pod tout
          # seul : sans nouvelle image (workflow relancé), on force le rollout.
          kubectl rollout restart deployment/boond-mcp -n tools4staff
          kubectl rollout status deployment/boond-mcp -n tools4staff --timeout=180s

      - name: Smoke test (public URL)
        run: |
          for _ in $(seq 1 12); do
            if curl -fsS https://boond.infine.com/healthz; then echo; exit 0; fi
            sleep 5
          done
          echo "::warning::https://boond.infine.com/healthz ne répond pas (DNS ou certificat pas encore en place ?)"
